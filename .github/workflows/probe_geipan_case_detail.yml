name: Probe GEIPAN case-detail and attachment structure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_geipan_case_detail.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture representative case pages
        working-directory: ufo_atlas/ingestion/geipan
        run: python probe_case_detail.py
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_CASE_DETAIL_PROBE
          path: ufo_atlas/ingestion/geipan/case_probe_output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
