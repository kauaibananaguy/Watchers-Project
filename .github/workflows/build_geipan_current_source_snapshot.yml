name: Build GEIPAN current and legacy source snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_geipan_current_source_snapshot.yml'

permissions:
  contents: write

concurrency:
  group: geipan-current-source-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl>=3.1,<4'
      - name: Acquire and reconcile official GEIPAN exports
        working-directory: ufo_atlas/ingestion/geipan
        run: >-
          python build_current_source_snapshot.py
          --output-root geipan_source_snapshot
          --package UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT.zip
      - name: Upload validated source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT
          path: |
            ufo_atlas/ingestion/geipan/UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT.zip
            ufo_atlas/ingestion/geipan/UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve compact source-snapshot evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC='ufo_atlas/ingestion/geipan/geipan_source_snapshot/output'
          DEST='ufo_atlas/ingestion/geipan/current_snapshot_latest'
          mkdir -p "$DEST"
          cp "$SRC/README_FIRST.md" "$DEST/"
          cp "$SRC/SOURCE_COLLECTION.json" "$DEST/"
          cp "$SRC/SOURCE_TABLE_PROFILES.json" "$DEST/"
          cp "$SRC/VALIDATION_REPORT.json" "$DEST/"
          cp "$SRC/manifest.json" "$DEST/"
          cp ufo_atlas/ingestion/geipan/UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT.zip.sha256 "$DEST/PACKAGE_SHA256.txt"
          printf '%s\n' "${GITHUB_RUN_ID}" > "$DEST/WORKFLOW_RUN_ID.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve GEIPAN current-source snapshot evidence [skip ci]'
          git push
