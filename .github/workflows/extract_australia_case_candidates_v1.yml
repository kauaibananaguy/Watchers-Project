name: Extract Australia UFO case candidates v1
on:
  push:
    branches: [main]
    paths:
      - ufo_atlas/ingestion/australia/extract_case_candidates_v1.py
      - .github/workflows/extract_australia_case_candidates_v1.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: australia-ufo-case-candidates-v1
  cancel-in-progress: false
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_ARTIFACT_ID: '9971797602'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact repaired source snapshot
        run: |
          set -euo pipefail
          mkdir -p source-outer source
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip > source-artifact.zip
          unzip -q source-artifact.zip -d source-outer
          unzip -q source-outer/AUSTRALIA_GOVERNMENT_UFO_SOURCE_SNAPSHOT_v0.3.1.zip -d source
          unzip -t source-outer/AUSTRALIA_GOVERNMENT_UFO_SOURCE_SNAPSHOT_v0.3.1.zip >/dev/null
      - name: Extract source-locked case candidates
        run: python ufo_atlas/ingestion/australia/extract_case_candidates_v1.py --input-dir source --output-dir module
      - name: Verify and package
        run: |
          python - <<'PY'
          import json,sqlite3
          s=json.load(open('module/SUMMARY.json'))
          assert s['status']=='PASS' and s['case_event_candidates']>25 and s['case_like_event_fragments']>100
          con=sqlite3.connect('module/AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.sqlite')
          assert con.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not con.execute('pragma foreign_key_check').fetchall()
          assert con.execute("select count(*) from case_candidate where record_type='CASE_EVENT'").fetchone()[0]==s['case_event_candidates']
          assert con.execute('select count(*) from case_candidate where encounter_class_candidate is not null').fetchone()[0]==0
          con.close()
          PY
          (cd module && zip -q -r ../AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip .)
          sha256sum AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip > AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip.sha256
          unzip -t AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0
          path: |
            AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip
            AUSTRALIA_UFO_IMPORT_MODULE_v0.1.0.zip.sha256
            module/SUMMARY.json
            module/CASE_CANDIDATES.csv
            module/EVENT_FRAGMENTS.csv
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
