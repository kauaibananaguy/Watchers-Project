name: Temporary UK MoD UFO reports export

on:
  push:
    paths:
      - '.github/workflows/temporary_uk_mod_ufo_reports_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official UK MoD annual UFO reports
        run: |
          set -euo pipefail
          mkdir -p export/reports
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a7582c440f0b6397f35efcb/ufo_report_2009.pdf -o export/reports/ufo_report_2009.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a789e38ed915d042206403a/ufo_report_2008.pdf -o export/reports/ufo_report_2008.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a78a53fed915d04220643b2/ufo_report_2007.pdf -o export/reports/ufo_report_2007.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a78be15ed915d07d35b2145/UFOReports2006WholeoftheUK.pdf -o export/reports/ufo_report_2006.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a789a0140f0b63247698ae6/UFOReports2005WholeoftheUK.pdf -o export/reports/ufo_report_2005.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a7971b7ed915d07d35b5898/UFOReports2004WholeoftheUK.pdf -o export/reports/ufo_report_2004.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a75c656e5274a545822e1ea/UFOReports2003WholeoftheUK.pdf -o export/reports/ufo_report_2003.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a79c019ed915d07d35b7d24/UFOReports2002WholeoftheUK.pdf -o export/reports/ufo_report_2002.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a79dfc9ed915d042206ba86/UFOReport2001.pdf -o export/reports/ufo_report_2001.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a78cd1d40f0b6324769a45e/UFOReport2000.pdf -o export/reports/ufo_report_2000.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a79bcace5274a684690bbc2/UFOReport1999.pdf -o export/reports/ufo_report_1999.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a78e38de5274a2acd18a91f/UFOReport1998.pdf -o export/reports/ufo_report_1998.pdf
          curl --fail --location --retry 3 --retry-delay 2 https://assets.publishing.service.gov.uk/media/5a758d2fe5274a6faebebd11/ufo_report_1997.pdf -o export/reports/ufo_report_1997.pdf
          test "$(find export/reports -type f -name '*.pdf' | wc -l)" -eq 13
          sha256sum export/reports/*.pdf > export/SHA256SUMS.txt
          find export/reports -type f -name '*.pdf' -printf '%f\t%s\n' | sort > export/SIZE_BYTES.tsv
          printf '13\n' > export/FILE_COUNT.txt
      - name: Upload official source artifact
        uses: actions/upload-artifact@v4
        with:
          name: uk-mod-ufo-reports-1997-2009
          path: export/
          if-no-files-found: error
          retention-days: 1
