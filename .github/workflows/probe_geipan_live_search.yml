name: Probe GEIPAN live case-search structure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_geipan_live_search.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture live search pages
        working-directory: ufo_atlas/ingestion/geipan
        run: python probe_live_search.py
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_LIVE_SEARCH_PROBE
          path: ufo_atlas/ingestion/geipan/probe_output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
