name: Acquire GEIPAN official source snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire_geipan_official_source_snapshot.yml'

permissions:
  contents: write

concurrency:
  group: geipan-official-source-snapshot
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl>=3.1,<4'

      - name: Acquire, census, ledger, and validate official GEIPAN exports
        run: >-
          python ufo_atlas/ingestion/geipan/acquire_geipan.py
          --output-root snapshot
          --snapshot-date 2026-09-03

      - name: Upload official source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0
          path: |
            snapshot/GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip
            snapshot/GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve compact acquisition evidence in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ufo_atlas/ingestion/geipan/latest
          cp snapshot/output/README_FIRST.md ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_COLLECTION.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_CENSUS.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_FILE_INVENTORY.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_FIELD_HEADERS.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/GEIPAN_SCHEMA_WORKBOOK_PROFILE.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/VALIDATION_REPORT.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip.sha256 ufo_atlas/ingestion/geipan/latest/PACKAGE_SHA256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > ufo_atlas/ingestion/geipan/latest/WORKFLOW_RUN_ID.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufo_atlas/ingestion/geipan/latest
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Preserve official GEIPAN source acquisition census [skip ci]'
          git push
