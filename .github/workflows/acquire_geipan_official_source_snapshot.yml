name: Acquire GEIPAN official source snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire_geipan_official_source_snapshot.yml'

permissions:
  contents: write

concurrency:
  group: geipan-official-source-snapshot
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  SNAPSHOT_DATE: '2026-09-03'
  SOURCE_COLLECTION_ID: 'SRC-COLLECTION-GEIPAN'

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl>=3.1,<4'

      - name: Download official GEIPAN source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshot/raw snapshot/headers snapshot/output

          download() {
            local name="$1"
            local url="$2"
            echo "Downloading ${name}"
            curl --fail --location --show-error --silent \
              --retry 6 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 900 \
              --user-agent 'Mozilla/5.0 Watchers-UFO-Atlas/1.0' \
              --dump-header "snapshot/headers/${name}.headers.txt" \
              --output "snapshot/raw/${name}" \
              "$url"
            test -s "snapshot/raw/${name}"
          }

          download 'GEIPAN_database_update_page.html' \
            'https://geipan.fr/fr/node/15'
          download 'GEIPAN_cases.csv' \
            'https://geipan.fr/sites/default/files/Base_de_donn%C3%A9es_des_cas.csv'
          download 'GEIPAN_testimonies_observations.csv' \
            'https://geipan.fr/sites/default/files/Base_de_donn%C3%A9es_des_t%C3%A9moignages.csv'
          download 'GEIPAN_table_field_description_2019-01-07.xlsx' \
            'https://geipan.fr/sites/default/files/Description_des_tables_et_champs_de_donn%C3%A9es_de_la_base_du_geipan_2019-01-07.xlsx'
          download 'GEIPAN_database_history_2019-02-26.pdf' \
            'https://geipan.fr/sites/default/files/2019-02-26_Historique_des_bases_au_GEIPAN.pdf'
          download 'GEIPAN_statistics_page.html' \
            'https://geipan.fr/fr/stats'

          sha256sum snapshot/raw/* > snapshot/output/SOURCE_SHA256SUMS.txt

      - name: Build source inventory and immutable row ledger
        run: |
          python - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import re
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          from openpyxl import load_workbook

          root = Path('snapshot')
          raw = root / 'raw'
          out = root / 'output'
          out.mkdir(parents=True, exist_ok=True)
          collection_id = 'SRC-COLLECTION-GEIPAN'
          acquired_at = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')

          urls = {
              'GEIPAN_database_update_page.html': 'https://geipan.fr/fr/node/15',
              'GEIPAN_cases.csv': 'https://geipan.fr/sites/default/files/Base_de_donn%C3%A9es_des_cas.csv',
              'GEIPAN_testimonies_observations.csv': 'https://geipan.fr/sites/default/files/Base_de_donn%C3%A9es_des_t%C3%A9moignages.csv',
              'GEIPAN_table_field_description_2019-01-07.xlsx': 'https://geipan.fr/sites/default/files/Description_des_tables_et_champs_de_donn%C3%A9es_de_la_base_du_geipan_2019-01-07.xlsx',
              'GEIPAN_database_history_2019-02-26.pdf': 'https://geipan.fr/sites/default/files/2019-02-26_Historique_des_bases_au_GEIPAN.pdf',
              'GEIPAN_statistics_page.html': 'https://geipan.fr/fr/stats',
          }

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          def detect_text(path: Path) -> tuple[str, str]:
              data = path.read_bytes()
              for encoding in ('utf-8-sig', 'utf-8', 'cp1252', 'latin-1'):
                  try:
                      return data.decode(encoding), encoding
                  except UnicodeDecodeError:
                      continue
              return data.decode('utf-8', errors='replace'), 'utf-8-replace'

          def detect_dialect(text: str) -> csv.Dialect:
              sample = text[:200000]
              try:
                  return csv.Sniffer().sniff(sample, delimiters=';,\t|')
              except csv.Error:
                  class Semi(csv.excel):
                      delimiter = ';'
                  return Semi()

          def normalize_key(value: Any) -> str:
              text = '' if value is None else str(value)
              text = re.sub(r'\s+', ' ', text).strip()
              return text

          def pick(row: dict[str, str], patterns: tuple[str, ...]) -> str:
              for key, value in row.items():
                  norm = re.sub(r'[^a-z0-9]+', '_', key.lower()).strip('_')
                  if any(re.search(pattern, norm) for pattern in patterns):
                      value = normalize_key(value)
                      if value:
                          return value
              return ''

          inventory = []
          for path in sorted(raw.iterdir()):
              if not path.is_file():
                  continue
              header_path = root / 'headers' / f'{path.name}.headers.txt'
              inventory.append({
                  'file_id': f'GEIPAN-FILE-{len(inventory)+1:03d}',
                  'file_name': path.name,
                  'source_url': urls[path.name],
                  'bytes': path.stat().st_size,
                  'sha256': sha256(path),
                  'http_headers': header_path.read_text(encoding='utf-8', errors='replace') if header_path.exists() else None,
                  'acquired_at': acquired_at,
              })

          csv_profiles: dict[str, Any] = {}
          ledger: list[dict[str, Any]] = []
          sequence = 0
          used_ids: dict[str, int] = {}

          for file_name, record_family in (
              ('GEIPAN_cases.csv', 'CASE'),
              ('GEIPAN_testimonies_observations.csv', 'TESTIMONY_OBSERVATION'),
          ):
              path = raw / file_name
              text, encoding = detect_text(path)
              dialect = detect_dialect(text)
              reader = csv.DictReader(text.splitlines(), dialect=dialect)
              headers = reader.fieldnames or []
              row_count = 0
              blank_rows = 0
              for row_number, row in enumerate(reader, start=2):
                  clean = {normalize_key(k): normalize_key(v) for k, v in row.items() if k is not None}
                  if not any(clean.values()):
                      blank_rows += 1
                      continue
                  row_count += 1
                  sequence += 1
                  source_native_id = pick(clean, (
                      r'(^|_)id($|_)', r'numero', r'num_', r'reference', r'cas_id', r'temoignage_id', r'observation_id'
                  ))
                  base_id = f'GEIPAN-{record_family}-{source_native_id}' if source_native_id else f'GEIPAN-{record_family}-ROW-{row_number:06d}'
                  used_ids[base_id] = used_ids.get(base_id, 0) + 1
                  source_record_id = base_id if used_ids[base_id] == 1 else f'{base_id}-DUP-{used_ids[base_id]:03d}'
                  original_date = pick(clean, (r'date.*observation', r'date.*cas', r'^date$', r'date_debut', r'date_obs'))
                  original_time = pick(clean, (r'heure.*observation', r'^heure$', r'time'))
                  original_location = pick(clean, (r'commune', r'lieu', r'localite', r'departement', r'location'))
                  title = pick(clean, (r'titre', r'nom.*cas', r'libelle'))
                  description = pick(clean, (r'recit', r'resume', r'description', r'synthese', r'texte'))
                  raw_json = json.dumps(clean, ensure_ascii=False, sort_keys=True)
                  ledger.append({
                      'source_collection_id': collection_id,
                      'source_sequence': sequence,
                      'source_record_id': source_record_id,
                      'source_native_id': source_native_id or None,
                      'source_record_family': record_family,
                      'source_file_id': next(i['file_id'] for i in inventory if i['file_name'] == file_name),
                      'source_locator': f'{file_name}:row:{row_number}',
                      'original_date_text': original_date or None,
                      'original_time_text': original_time or None,
                      'original_location_text': original_location or None,
                      'title_raw': title or None,
                      'description_raw': description or None,
                      'reference_raw': None,
                      'source_attributes_raw': raw_json,
                      'raw_payload': raw_json,
                      'transformation_status': 'ACQUIRED_UNTRANSFORMED',
                      'notes': None,
                      'row_sha256': hashlib.sha256(raw_json.encode('utf-8')).hexdigest(),
                  })
              csv_profiles[file_name] = {
                  'encoding': encoding,
                  'delimiter': dialect.delimiter,
                  'quotechar': dialect.quotechar,
                  'headers': headers,
                  'header_count': len(headers),
                  'nonblank_rows': row_count,
                  'blank_rows_skipped': blank_rows,
              }

          # Inspect GEIPAN's own field-description workbook.
          workbook_profile: dict[str, Any] = {'sheets': []}
          wb = load_workbook(raw / 'GEIPAN_table_field_description_2019-01-07.xlsx', read_only=True, data_only=False)
          for ws in wb.worksheets:
              preview = []
              for index, row in enumerate(ws.iter_rows(values_only=True), start=1):
                  if index > 12:
                      break
                  preview.append([None if value is None else str(value) for value in row[:30]])
              workbook_profile['sheets'].append({
                  'sheet_name': ws.title,
                  'max_row': ws.max_row,
                  'max_column': ws.max_column,
                  'preview_rows': preview,
              })

          source_collection = {
              'source_collection_id': collection_id,
              'collection_title': 'GEIPAN published cases, testimonies, and observations',
              'attribution_name': 'GEIPAN — Groupe d’études et d’informations sur les phénomènes aérospatiaux non identifiés',
              'owner_custodian': 'Centre national d’études spatiales (CNES)',
              'source_type': 'OFFICIAL_GOVERNMENT_DATABASE_EXPORT',
              'source_page_url': 'https://geipan.fr/fr/node/15',
              'case_search_url': 'https://geipan.fr/fr/recherche/cas',
              'statistics_url': 'https://geipan.fr/fr/stats',
              'acquisition_method': 'Direct public download from official GEIPAN website',
              'acquired_at': acquired_at,
              'rights_and_attribution_notes': (
                  'Official public downloads supplied for database and spreadsheet use. '
                  'Witness-confidential fields are withheld by GEIPAN; exported coordinates and ages are generalized for anonymization. '
                  'Original French wording and source identifiers must remain preserved.'
              ),
              'privacy_notes': (
                  'GEIPAN states that witness-confidential process fields are not exported; latitude/longitude are rounded to 0.1 degree, '
                  'occupational categories are generalized, and witness ages are binned by decade.'
              ),
              'source_file_count': len(inventory),
              'source_record_count': len(ledger),
              'case_row_count': csv_profiles['GEIPAN_cases.csv']['nonblank_rows'],
              'testimony_observation_row_count': csv_profiles['GEIPAN_testimonies_observations.csv']['nonblank_rows'],
              'declared_integration_standard': 'UFO-ATLAS-INT-STD-1.0.0',
              'declared_gmr_version': 'UFO Atlas GMR v1.0.0',
              'transformation_status': 'SOURCE_ACQUIRED_AND_CENSUSED',
          }

          # Write JSONL and CSV source ledger.
          with (out / 'SOURCE_RECORD_LEDGER.jsonl').open('w', encoding='utf-8') as f:
              for row in ledger:
                  f.write(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n')
          ledger_columns = list(ledger[0]) if ledger else []
          with (out / 'SOURCE_RECORD_LEDGER.csv').open('w', encoding='utf-8', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=ledger_columns)
              writer.writeheader()
              writer.writerows(ledger)

          # SQLite provenance snapshot.
          db = out / 'GEIPAN_SOURCE_ACQUISITION_v0.1.0.sqlite'
          if db.exists():
              db.unlink()
          con = sqlite3.connect(db)
          con.execute('PRAGMA foreign_keys=ON')
          con.executescript('''
          CREATE TABLE source_collection(
            source_collection_id TEXT PRIMARY KEY,
            payload_json TEXT NOT NULL
          );
          CREATE TABLE source_file(
            file_id TEXT PRIMARY KEY,
            file_name TEXT NOT NULL UNIQUE,
            source_url TEXT NOT NULL,
            bytes INTEGER NOT NULL,
            sha256 TEXT NOT NULL,
            acquired_at TEXT NOT NULL,
            http_headers TEXT
          );
          CREATE TABLE source_record_ledger(
            source_collection_id TEXT NOT NULL REFERENCES source_collection(source_collection_id),
            source_sequence INTEGER NOT NULL UNIQUE,
            source_record_id TEXT PRIMARY KEY,
            source_native_id TEXT,
            source_record_family TEXT NOT NULL,
            source_file_id TEXT NOT NULL REFERENCES source_file(file_id),
            source_locator TEXT NOT NULL,
            original_date_text TEXT,
            original_time_text TEXT,
            original_location_text TEXT,
            title_raw TEXT,
            description_raw TEXT,
            reference_raw TEXT,
            source_attributes_raw TEXT,
            raw_payload TEXT NOT NULL,
            transformation_status TEXT NOT NULL,
            notes TEXT,
            row_sha256 TEXT NOT NULL
          );
          CREATE INDEX idx_geipan_source_family ON source_record_ledger(source_record_family);
          CREATE INDEX idx_geipan_native_id ON source_record_ledger(source_native_id);
          CREATE INDEX idx_geipan_date ON source_record_ledger(original_date_text);
          CREATE INDEX idx_geipan_location ON source_record_ledger(original_location_text);
          ''')
          con.execute('INSERT INTO source_collection VALUES (?,?)', (collection_id, json.dumps(source_collection, ensure_ascii=False, sort_keys=True)))
          con.executemany(
              'INSERT INTO source_file VALUES (?,?,?,?,?,?,?)',
              [(i['file_id'], i['file_name'], i['source_url'], i['bytes'], i['sha256'], i['acquired_at'], i['http_headers']) for i in inventory]
          )
          con.executemany(
              f"INSERT INTO source_record_ledger VALUES ({','.join('?' for _ in ledger_columns)})",
              [tuple(row[column] for column in ledger_columns) for row in ledger]
          )
          con.commit()
          quick = con.execute('PRAGMA quick_check').fetchone()[0]
          fk = len(con.execute('PRAGMA foreign_key_check').fetchall())
          sequence_min, sequence_max, sequence_count = con.execute(
              'SELECT MIN(source_sequence), MAX(source_sequence), COUNT(DISTINCT source_sequence) FROM source_record_ledger'
          ).fetchone()
          duplicate_ids = con.execute(
              'SELECT COUNT(*) FROM (SELECT source_record_id FROM source_record_ledger GROUP BY source_record_id HAVING COUNT(*)>1)'
          ).fetchone()[0]
          con.close()

          validation = {
              'overall_status': 'PASS' if (
                  quick == 'ok' and fk == 0 and duplicate_ids == 0 and
                  sequence_min == 1 and sequence_max == len(ledger) and sequence_count == len(ledger)
              ) else 'FAIL',
              'stage': 'SOURCE_ACQUISITION_AND_CENSUS',
              'sqlite_quick_check': quick,
              'foreign_key_violations': fk,
              'duplicate_source_record_ids': duplicate_ids,
              'source_sequence_min': sequence_min,
              'source_sequence_max': sequence_max,
              'source_sequence_distinct_count': sequence_count,
              'source_record_count': len(ledger),
              'case_row_count': csv_profiles['GEIPAN_cases.csv']['nonblank_rows'],
              'testimony_observation_row_count': csv_profiles['GEIPAN_testimonies_observations.csv']['nonblank_rows'],
              'source_files': len(inventory),
              'candidate_records_built': 0,
              'gmr_transformation_started': False,
              'next_stage': 'SOURCE_FIELD_MAPPING_AND_CANONICAL_CANDIDATE_CONSTRUCTION',
              'known_limitations': [
                  'This is an acquisition/census checkpoint, not a completed GMR import module.',
                  'The official CSV export intentionally omits confidential witness and internal workflow fields.',
                  'Full free-form narratives and some weather/aviation supplemental tables may not be present in the downloadable CSV export.',
              ],
          }

          if validation['overall_status'] != 'PASS':
              raise SystemExit(json.dumps(validation, indent=2, ensure_ascii=False))

          (out / 'SOURCE_COLLECTION.json').write_text(json.dumps(source_collection, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'SOURCE_FILE_INVENTORY.json').write_text(json.dumps(inventory, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'SOURCE_CENSUS.json').write_text(json.dumps({
              'acquired_at': acquired_at,
              'source_collection_id': collection_id,
              'source_record_count': len(ledger),
              'case_row_count': csv_profiles['GEIPAN_cases.csv']['nonblank_rows'],
              'testimony_observation_row_count': csv_profiles['GEIPAN_testimonies_observations.csv']['nonblank_rows'],
              'source_sequence_start': 1,
              'source_sequence_end': len(ledger),
              'csv_profiles': csv_profiles,
              'geipan_schema_workbook_profile': workbook_profile,
          }, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'SOURCE_FIELD_HEADERS.json').write_text(json.dumps(csv_profiles, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'GEIPAN_SCHEMA_WORKBOOK_PROFILE.json').write_text(json.dumps(workbook_profile, indent=2, ensure_ascii=False), encoding='utf-8')
          (out / 'VALIDATION_REPORT.json').write_text(json.dumps(validation, indent=2, ensure_ascii=False), encoding='utf-8')

          readme = f'''# GEIPAN official source acquisition — v0.1.0

Status: **{validation['overall_status']}**  
Source collection: `{collection_id}`  
Acquired: `{acquired_at}`

This checkpoint preserves the official GEIPAN case CSV, testimony/observation CSV, field-description workbook, database-history PDF, source page, and statistics page. It creates one uninterrupted immutable source ledger covering every nonblank row in both official CSV exports.

## Actual source volume

- Case rows: **{source_collection['case_row_count']:,}**
- Testimony/observation rows: **{source_collection['testimony_observation_row_count']:,}**
- Total physical source rows: **{source_collection['source_record_count']:,}**
- Source files: **{source_collection['source_file_count']}**

## Architectural boundary

This is a source-acquisition checkpoint for the one source-neutral UFO Atlas. It is not a separate public GEIPAN database. No canonical candidates or irreversible matches have yet been created.

## Next stage

Map every GEIPAN source field to the controlling UFO Atlas GMR, preserve French source wording, construct source-neutral case/testimony/observation candidates, write English editorial translations separately, create typed relationships, and prepare duplicate proposals against the latest verified master.
'''
          (out / 'README_FIRST.md').write_text(readme, encoding='utf-8')

          # Manifest of output + raw files, excluding the manifest itself.
          manifest_files = []
          for path in sorted((root).rglob('*')):
              if path.is_file() and path.name != 'manifest.json':
                  manifest_files.append({
                      'path': str(path.relative_to(root)),
                      'bytes': path.stat().st_size,
                      'sha256': sha256(path),
                  })
          manifest = {
              'package_id': 'UFO-ATLAS-GEIPAN-SOURCE-SNAPSHOT-0.1.0',
              'source_collection_id': collection_id,
              'snapshot_date': '2026-09-03',
              'created_at': acquired_at,
              'files': manifest_files,
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, ensure_ascii=False), encoding='utf-8')
          print(json.dumps(validation, indent=2, ensure_ascii=False))
          PY

      - name: Package and independently verify acquisition snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp -a snapshot/raw snapshot/output release/
          python - <<'PY'
          import hashlib, json, sqlite3
          from pathlib import Path
          root = Path('release')
          report = json.loads((root/'output/VALIDATION_REPORT.json').read_text(encoding='utf-8'))
          if report['overall_status'] != 'PASS':
              raise SystemExit('Acquisition validation did not pass')
          db = root/'output/GEIPAN_SOURCE_ACQUISITION_v0.1.0.sqlite'
          con = sqlite3.connect(db)
          quick = con.execute('PRAGMA quick_check').fetchone()[0]
          fk = len(con.execute('PRAGMA foreign_key_check').fetchall())
          rows = con.execute('SELECT COUNT(*) FROM source_record_ledger').fetchone()[0]
          con.close()
          if quick != 'ok' or fk or rows != report['source_record_count']:
              raise SystemExit(f'Fresh verification failed: quick={quick}, fk={fk}, rows={rows}')
          Path('release/FRESH_VERIFICATION.json').write_text(json.dumps({
              'status':'PASS','sqlite_quick_check':quick,'foreign_key_violations':fk,
              'source_record_count':rows
          }, indent=2)+'\n', encoding='utf-8')
          PY
          (cd release && zip -q -r ../GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip .)
          sha256sum GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip > GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip.sha256
          unzip -t GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip >/dev/null

      - name: Upload official source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0
          path: |
            GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip
            GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Preserve compact acquisition evidence in repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ufo_atlas/ingestion/geipan/latest
          cp snapshot/output/README_FIRST.md ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_COLLECTION.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_CENSUS.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_FILE_INVENTORY.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/SOURCE_FIELD_HEADERS.json ufo_atlas/ingestion/geipan/latest/
          cp snapshot/output/VALIDATION_REPORT.json ufo_atlas/ingestion/geipan/latest/
          cp GEIPAN_OFFICIAL_SOURCE_SNAPSHOT_v0.1.0.zip.sha256 ufo_atlas/ingestion/geipan/latest/PACKAGE_SHA256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > ufo_atlas/ingestion/geipan/latest/WORKFLOW_RUN_ID.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufo_atlas/ingestion/geipan/latest
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Preserve official GEIPAN source acquisition census [skip ci]'
          git push
