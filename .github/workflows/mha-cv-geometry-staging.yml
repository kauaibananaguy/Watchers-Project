name: MHA cardiovascular geometry staging

on:
  push:
    branches:
      - mha-cv-geometry-staging-20260907

permissions:
  contents: read

env:
  BP3D_REPO: https://github.com/jixiangying/anatomy.git
  BP3D_COMMIT: be67a977abe25a36f59793fda86a506618fd4d27
  HRA_REPO_RAW: https://raw.githubusercontent.com/hubmapconsortium/ccf-releases/main/v1.2/models

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Acquire BodyParts3D reference-only set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source
          git clone --filter=blob:none --no-checkout "$BP3D_REPO" work/bp3d
          cd work/bp3d
          git sparse-checkout init --cone
          git sparse-checkout set data isa_BP3D_4.0_obj_99
          git checkout "$BP3D_COMMIT"
          cd ../..
          python - <<'PY'
          import json, pathlib, shutil, csv, hashlib
          root = pathlib.Path('work/bp3d')
          out = pathlib.Path('work/source/BLOCKED_REFERENCE_ONLY_bodyparts3d_cv')
          out.mkdir(parents=True, exist_ok=True)
          data = json.loads((root/'data/anatomy_data_simple_refined.json').read_text(encoding='utf-8'))
          cv = data.get('cardiovascular', [])
          rows=[]; missing=[]; seen=set()
          for rec in cv:
              fj=rec['id']
              if fj in seen: continue
              seen.add(fj)
              src=root/'isa_BP3D_4.0_obj_99'/f'{fj}.obj'
              if not src.exists(): missing.append(fj); continue
              dst=out/src.name; shutil.copy2(src,dst); b=dst.read_bytes()
              rows.append({'fj_id':fj,'name':rec.get('nameEn',''),'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          for name in ['isa_parts_list_e.txt','isa_parts_list.txt','isa_element_parts.txt','anatomy_data_simple_refined.json']:
              shutil.copy2(root/'data'/name, pathlib.Path('work/source')/name)
          with open('work/source/bodyparts3d_reference_manifest.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['fj_id','name','bytes','sha256']); w.writeheader(); w.writerows(rows)
          pathlib.Path('work/source/BODYPARTS3D_PRODUCTION_BLOCK.txt').write_text(
              'REFERENCE ONLY. DO NOT USE TO CREATE, FIT, SCULPT, REGISTER, OR SHIP MHA PRODUCTION GEOMETRY. '+
              'The controlling MHA source policy blocks BodyParts3D because the exact Release 4.0 OBJ files carry CC Attribution-ShareAlike 2.1 Japan.\n',encoding='utf-8')
          print('reference-only OBJ copied:',len(rows),'missing:',len(missing))
          PY

      - name: Acquire HuBMAP HRA production-eligible male assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source/hra
          for f in VH_M_Heart.glb VH_M_Blood_Vasculature.glb VH_M_Pelvis.glb VH_M_Lung.glb VH_M_Prostate.glb ASCT-B_3D_Models_Mapping.csv; do
            curl -fL --retry 4 --retry-delay 2 "$HRA_REPO_RAW/$f" -o "work/source/hra/$f"
          done
          python - <<'PY'
          import pathlib, hashlib, csv
          root=pathlib.Path('work/source/hra')
          expected={'VH_M_Heart.glb':4071500,'VH_M_Blood_Vasculature.glb':7436204,'VH_M_Pelvis.glb':1348060,'VH_M_Lung.glb':6355840,'VH_M_Prostate.glb':4086328,'ASCT-B_3D_Models_Mapping.csv':272624}
          rows=[]
          for p in root.iterdir():
              if p.is_file():
                  b=p.read_bytes()
                  if p.name in expected and len(b)!=expected[p.name]: raise SystemExit(f'Unexpected byte size {p.name}: {len(b)} != {expected[p.name]}')
                  rows.append({'file':p.name,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          with open('work/source/hra_manifest.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=['file','bytes','sha256']); w.writeheader(); w.writerows(rows)
          PY

      - name: Record source provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > work/source/SOURCE_PROVENANCE.md <<'EOF'
          # MHA cardiovascular geometry source staging

          ## Production-eligible source lane
          HuBMAP HRA v1.2 male heart, male blood vasculature, pelvis, lung, and prostate assets. The pelvis/lung/prostate are registration landmarks/context, not cardiovascular content.

          ## Blocked reference lane
          BodyParts3D Release 4.0 mirror at pinned commit `be67a977abe25a36f59793fda86a506618fd4d27`. Exact OBJ files embed a CC Attribution-ShareAlike 2.1 Japan notice. The controlling MHA source policy explicitly blocks share-alike sources, including temporary production-pipeline use. These files are quarantined as provenance/reference only and MUST NOT contribute vertices, transforms, fitted paths, sculpting, or derivatives to production geometry.
          EOF
          sha256sum work/source/hra/* > work/source/hra_source_sha256.txt
          du -sh work/source

      - name: Upload cardiovascular geometry source artifact
        uses: actions/upload-artifact@v4
        with:
          name: MHA_CARDIOVASCULAR_GEOMETRY_SOURCES_WITH_REGISTRATION_2026-09-07
          path: work/source
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
