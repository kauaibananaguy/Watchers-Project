name: Probe GEIPAN current full export endpoints

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_geipan_export_endpoints.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download live exports
        working-directory: ufo_atlas/ingestion/geipan
        run: python probe_export_endpoints.py
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_CURRENT_EXPORT_ENDPOINTS
          path: ufo_atlas/ingestion/geipan/export_probe_output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
