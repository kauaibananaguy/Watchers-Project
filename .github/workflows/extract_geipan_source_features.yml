name: Extract GEIPAN source features

on:
  workflow_run:
    workflows:
      - 'Acquire GEIPAN linked case assets'
    types:
      - completed
  workflow_dispatch:
    inputs:
      asset_run_id:
        description: Successful linked-asset run ID; blank uses latest successful run
        required: false
        default: ''
      case_page_run_id:
        description: Successful case-page run ID; blank uses latest successful run
        required: false
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: geipan-source-feature-extraction
  cancel-in-progress: false

jobs:
  extract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and download source artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ASSET_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_ASSET_RUN_ID: ${{ inputs.asset_run_id }}
          INPUT_CASE_PAGE_RUN_ID: ${{ inputs.case_page_run_id }}
        run: |
          set -euo pipefail
          ASSET_RUN_ID="${INPUT_ASSET_RUN_ID:-${EVENT_ASSET_RUN_ID:-}}"
          if [ -z "$ASSET_RUN_ID" ]; then
            ASSET_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/acquire_geipan_linked_assets.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          CASE_PAGE_RUN_ID="${INPUT_CASE_PAGE_RUN_ID:-}"
          if [ -z "$CASE_PAGE_RUN_ID" ]; then
            CASE_PAGE_RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/acquire_geipan_case_pages_v2.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$ASSET_RUN_ID"
          test -n "$CASE_PAGE_RUN_ID"

          ASSET_ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ASSET_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="GEIPAN_LINKED_ASSET_METADATA_AND_TEXT_v0.1.0") | .id' | head -1)"
          PAGE_ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CASE_PAGE_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0") | .id' | head -1)"
          test -n "$ASSET_ARTIFACT_ID"
          test -n "$PAGE_ARTIFACT_ID"

          for spec in "asset:${ASSET_ARTIFACT_ID}" "page:${PAGE_ARTIFACT_ID}"; do
            name="${spec%%:*}"
            id="${spec##*:}"
            curl --fail --location \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              --output "${name}-artifact.zip"
            mkdir -p "${name}-artifact" "${name}-snapshot"
            unzip -q "${name}-artifact.zip" -d "${name}-artifact"
          done
          ASSET_INNER="$(find asset-artifact -type f -name 'GEIPAN_LINKED_ASSET_METADATA_AND_TEXT_v0.1.0.zip' -print -quit)"
          PAGE_INNER="$(find page-artifact -type f -name 'GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip' -print -quit)"
          test -n "$ASSET_INNER"
          test -n "$PAGE_INNER"
          unzip -q "$ASSET_INNER" -d asset-snapshot
          unzip -q "$PAGE_INNER" -d page-snapshot
      - name: Extract directly supported French source features
        run: |
          mkdir -p output
          python ufo_atlas/ingestion/geipan/extract_source_features_v1.py \
            --case-pages page-snapshot \
            --assets asset-snapshot \
            --output output/GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.sqlite \
            --summary output/SUMMARY.json
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          db=Path('output/GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.sqlite')
          con=sqlite3.connect(db)
          quick=con.execute('PRAGMA quick_check').fetchone()[0]
          fk=len(con.execute('PRAGMA foreign_key_check').fetchall())
          assertions=con.execute('SELECT COUNT(*) FROM feature_assertion').fetchone()[0]
          sources=con.execute('SELECT COUNT(*) FROM source_document').fetchone()[0]
          con.close()
          if quick!='ok' or fk:
              raise SystemExit(f'quick={quick} fk={fk}')
          summary=json.load(open('output/SUMMARY.json'))
          if summary.get('overall_status')!='PASS' or summary.get('feature_assertions')!=assertions:
              raise SystemExit('Summary/database mismatch')
          Path('output/FRESH_VERIFICATION.json').write_text(json.dumps({'status':'PASS','sqlite_quick_check':quick,'foreign_key_violations':fk,'source_documents':sources,'feature_assertions':assertions},indent=2)+'\n')
          PY
          (cd output && zip -q -r ../GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip .)
          sha256sum GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip > GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip.sha256
          unzip -t GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0
          path: |
            GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip
            GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve compact extraction evidence
        run: |
          set -euo pipefail
          mkdir -p ufo_atlas/ingestion/geipan/features_latest
          cp output/SUMMARY.json ufo_atlas/ingestion/geipan/features_latest/
          cp output/FRESH_VERIFICATION.json ufo_atlas/ingestion/geipan/features_latest/
          cp GEIPAN_SOURCE_FEATURE_ASSERTIONS_v0.1.0.zip.sha256 ufo_atlas/ingestion/geipan/features_latest/PACKAGE_SHA256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > ufo_atlas/ingestion/geipan/features_latest/WORKFLOW_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufo_atlas/ingestion/geipan/features_latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve GEIPAN source-feature extraction evidence [skip ci]'
          git push
