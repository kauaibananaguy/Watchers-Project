name: Temporary full Larry Hatch binary export

on:
  push:
    paths:
      - '.github/workflows/temporary_hatch_full_binary_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out RR0 uDb reader
        uses: actions/checkout@v4
        with:
          repository: RR0/uDb
          ref: master
          path: udb
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: udb/package-lock.json
      - name: Install, build, and export every binary record
        working-directory: udb
        run: |
          set -euo pipefail
          npm ci
          npm run build
          python - <<'PY'
          from pathlib import Path
          p=Path('bin/index.ts')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.option("-db, --database <udb|nuforc> [source]",', '.option("--database <udb|nuforc> [source]",')
          s=s.replace('.option("-wm, --worldmap [wmFile]",', '.option("--worldmap [wmFile]",')
          p.write_text(s, encoding='utf-8')
          PY
          mkdir -p ../export
          npx tsx bin/index.ts \
            --database udb data/udb/input/U.RND \
            --sources data/udb/input/usources.txt \
            --worldmap data/udb/input/WM.VCE \
            --format xml \
            --out ../export/hatch_udb_full.xml
          test -s ../export/hatch_udb_full.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          p='../export/hatch_udb_full.xml'
          root=ET.parse(p).getroot()
          records=root.findall('.//record')
          assert len(records)==18123, len(records)
          ids=[int(r.findtext('id')) for r in records]
          assert ids[0]==1 and ids[-1]==18123
          open('../export/RECORD_COUNT.txt','w').write(f'{len(records)}\n')
          PY
          sha256sum ../export/hatch_udb_full.xml > ../export/SHA256SUMS.txt
          cp data/udb/input/U.RND ../export/U.RND
          sha256sum ../export/U.RND >> ../export/SHA256SUMS.txt
      - name: Upload full source artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatch-full-binary-export
          path: export/
          if-no-files-found: error
          retention-days: 1
