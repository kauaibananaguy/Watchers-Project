name: Temporary TNA UFO May 2008 source export

on:
  push:
    paths:
      - '.github/workflows/temporary_tna_ufo_may_2008_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download preserved copies of TNA May 2008 UFO files
        run: |
          set -euo pipefail
          mkdir -p export
          declare -A urls
          urls[DEFE31-172]="https://www.theblackvault.com/documents/ufos/UK/DEFE31-172.pdf"
          urls[DEFE31-173]="https://www.theblackvault.com/documents/ufos/UK/DEFE31-173.pdf"
          urls[DEFE31-174]="https://www.theblackvault.com/documents/ufos/UK/DEFE31-174.pdf"
          urls[DEFE31-175]="https://www.theblackvault.com/documents/ufos/UK/DEFE31-175.pdf"
          urls[DEFE24-1922]="https://www.theblackvault.com/documents/ufos/UK/DEFE24-1922.pdf"
          urls[DEFE24-1923]="https://www.theblackvault.com/documents/ufos/UK/DEFE24-1923.pdf"
          urls[DEFE24-1924]="https://www.theblackvault.com/documents/ufos/UK/DEFE24-1924.pdf"
          urls[DEFE24-1925]="https://www.theblackvault.com/documents/ufos/UK/DEFE24-1925.pdf"
          order=(DEFE31-172 DEFE31-173 DEFE31-174 DEFE31-175 DEFE24-1922 DEFE24-1923 DEFE24-1924 DEFE24-1925)
          for ref in "${order[@]}"; do
            url="${urls[$ref]}"
            out="export/${ref}.pdf"
            echo "Downloading ${ref}"
            curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 30 \
              "$url" --output "$out"
            test -s "$out"
            file "$out" | grep -qi 'PDF document'
          done
          sha256sum export/*.pdf > export/SHA256SUMS.txt
          wc -c export/*.pdf > export/SIZE_BYTES.txt
          python - <<'PY'
          from pathlib import Path
          import json
          order=['DEFE31-172','DEFE31-173','DEFE31-174','DEFE31-175','DEFE24-1922','DEFE24-1923','DEFE24-1924','DEFE24-1925']
          files=[]
          for ref in order:
              p=Path('export')/(ref+'.pdf')
              files.append({
                  'tna_reference': ref.replace('DEFE31-','DEFE 31/').replace('DEFE24-','DEFE 24/') + '/1',
                  'file': p.name,
                  'size_bytes': p.stat().st_size,
                  'acquisition_route': 'Preserved copy of TNA-released PDF from The Black Vault'
              })
          assert len(files)==8
          Path('export/SOURCE_MANIFEST.json').write_text(json.dumps({'release':'TNA May 2008','files':files},indent=2))
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tna-ufo-may-2008-pdfs
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
