name: Temporary TNA UFO May 2008 source export

on:
  push:
    paths:
      - '.github/workflows/temporary_tna_ufo_may_2008_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download preserved copies of TNA May 2008 UFO files
        run: |
          set -euo pipefail
          mkdir -p export
          order=(DEFE31-172 DEFE31-173 DEFE31-174 DEFE31-175 DEFE24-1922 DEFE24-1923 DEFE24-1924 DEFE24-1925)
          for ref in "${order[@]}"; do
            out="export/${ref}.pdf"
            compact="$ref"
            lower="$(echo "$ref" | tr '[:upper:]' '[:lower:]')"
            dashed="$(echo "$lower" | sed -E 's/defe([0-9]+)-/defe-\1-/')-1"
            candidates=(
              "https://documents.theblackvault.com/documents/ufos/UK/${compact}.pdf"
              "https://documents.theblackvault.com/documents/ufos/UK/${lower}.pdf"
              "https://documents.theblackvault.com/documents/ufos/UK/${dashed}.pdf"
              "https://www.theblackvault.com/documents/ufos/UK/${compact}.pdf"
            )
            ok=0
            for url in "${candidates[@]}"; do
              echo "Trying ${url}"
              rm -f "$out"
              if curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 30 \
                --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
                --referer 'https://www.theblackvault.com/documentarchive/united-kingdom-ufo-documents/' \
                "$url" --output "$out"; then
                if test -s "$out" && file "$out" | grep -qi 'PDF document'; then
                  ok=1
                  echo "$url" > "export/${ref}.source_url.txt"
                  break
                fi
              fi
            done
            if [ "$ok" -ne 1 ]; then
              echo "Failed to acquire ${ref}" >&2
              exit 1
            fi
          done
          sha256sum export/*.pdf > export/SHA256SUMS.txt
          wc -c export/*.pdf > export/SIZE_BYTES.txt
          python - <<'PY'
          from pathlib import Path
          import json
          order=['DEFE31-172','DEFE31-173','DEFE31-174','DEFE31-175','DEFE24-1922','DEFE24-1923','DEFE24-1924','DEFE24-1925']
          files=[]
          for ref in order:
              p=Path('export')/(ref+'.pdf')
              u=(Path('export')/(ref+'.source_url.txt')).read_text().strip()
              files.append({
                  'tna_reference': ref.replace('DEFE31-','DEFE 31/').replace('DEFE24-','DEFE 24/') + '/1',
                  'file': p.name,
                  'size_bytes': p.stat().st_size,
                  'acquisition_url': u,
                  'acquisition_route': 'Preserved copy of TNA-released PDF'
              })
          assert len(files)==8
          Path('export/SOURCE_MANIFEST.json').write_text(json.dumps({'release':'TNA May 2008','files':files},indent=2))
          PY
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: tna-ufo-may-2008-pdfs
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 2
