name: UFO Atlas Pass 2 — GEIPAN English + CE1-CE5

on:
  push:
    branches:
      - ufo-atlas-pass2-geipan-en-ce
    paths:
      - 'ufo_atlas/ingestion/geipan/pass2/**'
      - '.github/workflows/pass2_geipan_en_ce.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: geipan-pass2-en-ce
  cancel-in-progress: false

jobs:
  translate:
    name: Translate shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install translation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.8.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers==4.56.2' sentencepiece sacremoses lxml
      - name: Download verified repaired GEIPAN source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_outer source
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/kauaibananaguy/Watchers-Project/actions/artifacts/9952460380/zip' \
            -o source_artifact.zip
          unzip -q source_artifact.zip -d source_outer
          INNER=$(find source_outer -maxdepth 2 -type f -name 'GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.zip' -print -quit)
          test -n "$INNER"
          unzip -q "$INNER" -d source
          test -f source/GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.sqlite
      - name: Translate and classify shard
        env:
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          mkdir -p shard_out
          python ufo_atlas/ingestion/geipan/pass2/pass2_enrich_geipan.py \
            --db source/GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.sqlite \
            --out shard_out/geipan_pass2_shard_${{ matrix.shard }}.jsonl \
            --shard ${{ matrix.shard }} \
            --shards 4 \
            --translate yes
          test -s shard_out/geipan_pass2_shard_${{ matrix.shard }}.jsonl
          wc -l shard_out/geipan_pass2_shard_${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: pass2-shard-${{ matrix.shard }}
          path: shard_out/*.jsonl
          if-no-files-found: error
          retention-days: 30

  assemble:
    name: Assemble and validate Pass 2 database
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: pass2-shard-*
          path: shards
          merge-multiple: true
      - name: Download verified repaired GEIPAN source snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p source_outer source
          curl -fL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/kauaibananaguy/Watchers-Project/actions/artifacts/9952460380/zip' \
            -o source_artifact.zip
          unzip -q source_artifact.zip -d source_outer
          INNER=$(find source_outer -maxdepth 2 -type f -name 'GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.zip' -print -quit)
          test -n "$INNER"
          unzip -q "$INNER" -d source
          test -f source/GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.sqlite
      - name: Build and independently validate successor database
        run: |
          python ufo_atlas/ingestion/geipan/pass2/build_pass2_database_v2.py \
            --source-db source/GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.1_REPAIRED.sqlite \
            --jsonl-dir shards \
            --out-dir release
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('release/VALIDATION_REPORT.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS', r
          assert r['pass2_case_count']==3381, r
          assert r['foreign_key_violations']==0, r
          assert r['missing_english_fields']==0, r
          assert r['missing_french_originals']==0, r
          assert r['english_not_first']==0, r
          print(json.dumps(r, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: UFO_ATLAS_GEIPAN_PASS2_v0.2.0
          path: |
            release/UFO_ATLAS_GEIPAN_PASS2_v0.2.0.zip
            release/UFO_ATLAS_GEIPAN_PASS2_v0.2.0.sqlite
            release/GEIPAN_PASS2_CASE_INDEX.csv
            release/VALIDATION_REPORT.json
            release/manifest.json
            release/PACKAGE_SHA256.txt
            release/README_FIRST.txt
          if-no-files-found: error
          retention-days: 30
