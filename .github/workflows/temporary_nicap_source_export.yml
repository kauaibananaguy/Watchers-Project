name: Temporary NICAP source export

on:
  push:
    paths:
      - '.github/workflows/temporary_nicap_source_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public UFO data repository
        uses: actions/checkout@v4
        with:
          repository: richgel999/ufo_data
          ref: main
          path: source
      - name: Prepare source artifact
        run: |
          set -euo pipefail
          mkdir -p export
          cp source/bin/nicap_db.json export/nicap_db.json
          sha256sum export/nicap_db.json > export/SHA256SUMS.txt
          wc -c export/nicap_db.json > export/SIZE_BYTES.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicap-source-json
          path: export/
          if-no-files-found: error
          retention-days: 1
