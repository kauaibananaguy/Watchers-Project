name: Temporary NICAP source export

on:
  push:
    paths:
      - '.github/workflows/temporary_nicap_source_export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download public NICAP source file
        run: |
          set -euo pipefail
          mkdir -p export
          curl --fail --location --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/richgel999/ufo_data/main/bin/nicap_db.json \
            --output export/nicap_db.json
          test "$(wc -c < export/nicap_db.json)" -gt 2500000
          python - <<'PY'
          import json
          with open('export/nicap_db.json', encoding='utf-8-sig') as f:
              payload = json.load(f)
          assert isinstance(payload.get('NICAP Data'), list)
          assert len(payload['NICAP Data']) > 5000
          PY
          sha256sum export/nicap_db.json > export/SHA256SUMS.txt
          wc -c export/nicap_db.json > export/SIZE_BYTES.txt
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicap-source-json
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
