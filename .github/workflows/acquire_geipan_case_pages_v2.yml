name: Acquire GEIPAN case pages v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/acquire_geipan_case_pages_v2.yml'
      - 'ufo_atlas/ingestion/geipan/crawl_case_packets_from_snapshot.py'
      - 'ufo_atlas/ingestion/geipan/crawl_case_pages_v2.py'

permissions:
  actions: read
  contents: write

concurrency:
  group: geipan-case-packet-acquisition
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  SOURCE_ARTIFACT_ID: '9930286890'
  EXPECTED_CASES: '3381'
  BATCH_SIZE: '100'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl>=3.1,<4'
      - name: Download and unpack validated GEIPAN source snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            --output source-artifact.zip
          mkdir -p source-artifact source-snapshot
          unzip -q source-artifact.zip -d source-artifact
          INNER="$(find source-artifact -type f -name 'UFO_ATLAS_IMPORT_GEIPAN_GMR1.0.0_v0.2.0_SOURCE_SNAPSHOT.zip' -print -quit)"
          test -n "$INNER"
          unzip -q "$INNER" -d source-snapshot
      - id: plan
        name: Build immutable 3,381-case acquisition plan
        run: |
          mkdir -p plan
          python ufo_atlas/ingestion/geipan/crawl_case_packets_from_snapshot.py plan \
            --live-index-dir source-snapshot \
            --output-dir plan \
            --expected-cases "$EXPECTED_CASES" \
            --batch-size "$BATCH_SIZE"
          echo "matrix=$(cat plan/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: geipan-case-page-plan-v2
          path: plan/
          if-no-files-found: error
          retention-days: 90

  acquire:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: geipan-case-page-plan-v2
          path: plan
      - name: Preserve official case pages and enumerate all linked assets
        run: |
          OUT="batch-${{ matrix.batch_index }}"
          python ufo_atlas/ingestion/geipan/crawl_case_pages_v2.py crawl \
            --case-urls plan/case_urls.json \
            --batch-index '${{ matrix.batch_index }}' \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --output-dir "$OUT" \
            --delay-seconds 8.0 \
            --retries 9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geipan-case-page-v2-batch-${{ matrix.batch_index }}
          path: batch-${{ matrix.batch_index }}/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  aggregate:
    needs: [plan, acquire]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: geipan-case-page-v2-batch-*
          path: batch-results
          merge-multiple: false
      - name: Aggregate and validate complete GEIPAN case-page snapshot
        run: |
          mkdir -p aggregate
          python ufo_atlas/ingestion/geipan/crawl_case_pages_v2.py aggregate \
            --input-dir batch-results \
            --output-dir aggregate \
            --expected-cases "$EXPECTED_CASES"
          (cd aggregate && zip -q -r ../GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip .)
          sha256sum GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip > GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip.sha256
          unzip -t GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0
          path: |
            GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip
            GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve compact completion evidence
        run: |
          set -euo pipefail
          mkdir -p ufo_atlas/ingestion/geipan/case_pages_latest
          cp aggregate/SUMMARY.json ufo_atlas/ingestion/geipan/case_pages_latest/
          cp aggregate/CASE_PAGE_INDEX.csv ufo_atlas/ingestion/geipan/case_pages_latest/
          cp aggregate/ASSET_URL_INDEX.csv ufo_atlas/ingestion/geipan/case_pages_latest/
          cp GEIPAN_CASE_PAGE_SOURCE_SNAPSHOT_v0.2.0.zip.sha256 ufo_atlas/ingestion/geipan/case_pages_latest/PACKAGE_SHA256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > ufo_atlas/ingestion/geipan/case_pages_latest/WORKFLOW_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufo_atlas/ingestion/geipan/case_pages_latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve complete GEIPAN case-page snapshot evidence [skip ci]'
          git push
