name: Temporary LAC UFO archive probe

on:
  push:
    paths:
      - '.github/workflows/temporary_lac_ufo_probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Probe LAC UFO search results and record links
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 requests
          mkdir -p export
          python - <<'PY'
          import json, urllib.parse, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup

          base='https://www.collectionscanada.gc.ca/databases/ufo/'
          search_url=base+'001057-100.01-e.php'
          results_url=base+'001057-110.01-e.php'
          groups=['Department of National Defence','Department of Transport','National Research Council','Royal Canadian Mounted Police']
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (compatible; WatchersProjectResearch/1.0)'})
          first=s.get(search_url,timeout=60)
          first.raise_for_status()
          enc=first.encoding or first.apparent_encoding or 'latin-1'
          text=first.content.decode(enc,errors='replace')
          soup=BeautifulSoup(text,'html.parser')
          sid=soup.find('input',{'name':'PHPSESSID'})
          sid=sid.get('value') if sid else None
          report={'session_id':sid,'groups':[]}
          for group in groups:
              params={'q7':group,'interval':'50'}
              if sid: params['PHPSESSID']=sid
              r=s.get(results_url,params=params,timeout=120)
              raw=r.content
              enc=r.encoding or r.apparent_encoding or 'latin-1'
              html=raw.decode(enc,errors='replace')
              name=re.sub(r'[^a-z0-9]+','_',group.lower()).strip('_')
              Path(f'export/{name}_page1.html').write_text(html,encoding='utf-8')
              sp=BeautifulSoup(html,'html.parser')
              links=[]
              for a in sp.find_all('a',href=True):
                  href=urllib.parse.urljoin(r.url,a['href'])
                  label=' '.join(a.get_text(' ',strip=True).split())
                  if '001057' in href or '/ufo/' in href.lower() or 'documents/' in href.lower():
                      links.append({'label':label,'url':href})
              text_preview=' '.join(sp.get_text(' ',strip=True).split())[:4000]
              report['groups'].append({
                  'group':group,'requested_url':r.request.url,'final_url':r.url,'status':r.status_code,
                  'bytes':len(raw),'title':sp.title.get_text(' ',strip=True) if sp.title else None,
                  'links':links[:300],'text_preview':text_preview,
              })
          Path('export/search_probe_report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False),encoding='utf-8')
          PY
          sha256sum export/* > export/SHA256SUMS.txt
      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: lac-ufo-search-probe
          path: export/
          if-no-files-found: error
          retention-days: 2
