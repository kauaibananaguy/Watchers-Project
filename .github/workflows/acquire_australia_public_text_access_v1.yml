name: Acquire Australia public UFO text access v1
on:
  push:
    branches: [main]
    paths:
      - ufo_atlas/ingestion/australia/acquire_public_text_access_v1.py
      - .github/workflows/acquire_australia_public_text_access_v1.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: australia-public-text-access-v1
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-cache-dir requests beautifulsoup4
      - run: python ufo_atlas/ingestion/australia/acquire_public_text_access_v1.py --output-dir snapshot --delay 1.5
      - name: Verify and package
        run: |
          python - <<'PY'
          import json,sqlite3
          s=json.load(open('snapshot/SUMMARY.json'))
          assert s['status']=='PASS' and s['discovered_file_pages']>=10 and s['text_access_pages_recovered']>=10
          con=sqlite3.connect('snapshot/AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.sqlite')
          assert con.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert con.execute('select count(*) from access_copy where visible_text is not null').fetchone()[0]==s['text_access_pages_recovered']
          con.close()
          PY
          (cd snapshot && zip -q -r ../AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip .)
          sha256sum AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip > AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip.sha256
          unzip -t AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0
          path: |
            AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip
            AUSTRALIA_PUBLIC_TEXT_ACCESS_v0.1.0.zip.sha256
            snapshot/SUMMARY.json
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
