name: Temporary LAC UFO full scan acquisition and OCR

on:
  push:
    paths:
      - '.github/workflows/temporary_lac_ufo_full_scan_ocr.yml'

permissions:
  contents: read
  actions: read

jobs:
  process:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out acquisition worker
        uses: actions/checkout@v4
      - name: Download complete LAC metadata union
        uses: actions/download-artifact@v4
        with:
          name: lac-ufo-complete-metadata-union
          path: metadata
          github-token: ${{ github.token }}
          repository: kauaibananaguy/Watchers-Project
          run-id: 33924142848
      - name: Install OCR dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng tesseract-ocr-fra
          python -m pip install --quiet requests beautifulsoup4 pillow
      - name: Acquire, hash, and OCR this scan partition
        env:
          CHUNK: ${{ matrix.chunk }}
          CHUNK_COUNT: 8
          OMP_THREAD_LIMIT: 1
          OMP_NUM_THREADS: 1
        run: |
          set -euo pipefail
          python tools/lac_scan_worker.py --metadata-root metadata --output output --chunk "$CHUNK" --chunk-count "$CHUNK_COUNT"
          sha256sum output/* > output/SHA256SUMS.txt
      - name: Upload scan/OCR partition
        uses: actions/upload-artifact@v4
        with:
          name: lac-ufo-scan-ocr-${{ matrix.chunk }}
          path: output/
          if-no-files-found: error
          compression-level: 9
          retention-days: 3
