name: Acquire GEIPAN case pages and attachments

on:
  workflow_run:
    workflows:
      - 'Acquire complete GEIPAN live case index'
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful live-index workflow run ID; blank uses latest successful run
        required: false
        default: ''

permissions:
  actions: read
  contents: write

concurrency:
  group: geipan-case-packet-acquisition
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  EXPECTED_CASES: '3381'
  BATCH_SIZE: '100'

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and download complete live-index artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          RUN_ID="${INPUT_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/crawl_geipan_live_case_index.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          ARTIFACT_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name=="GEIPAN_LIVE_CASE_INDEX_v0.1.1" or .name=="GEIPAN_LIVE_CASE_INDEX_v0.1.0") | .id' | head -1)"
          test -n "$ARTIFACT_ID"
          curl --fail --location \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output live-index-artifact.zip
          mkdir -p live-index-artifact
          unzip -q live-index-artifact.zip -d live-index-artifact
          find live-index-artifact -type f -maxdepth 8 -print
      - id: plan
        name: Build immutable case-packet acquisition plan
        run: |
          mkdir -p plan
          python ufo_atlas/ingestion/geipan/crawl_case_packets.py plan \
            --live-index-dir live-index-artifact \
            --output-dir plan \
            --expected-cases "$EXPECTED_CASES" \
            --batch-size "$BATCH_SIZE"
          echo "matrix=$(cat plan/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: geipan-case-packet-plan
          path: plan/
          if-no-files-found: error
          retention-days: 90

  acquire:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text-layer reader
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'pypdf>=6,<7'
      - uses: actions/download-artifact@v4
        with:
          name: geipan-case-packet-plan
          path: plan
      - name: Acquire official case pages and linked assets
        run: |
          OUT="batch-${{ matrix.batch_index }}"
          python ufo_atlas/ingestion/geipan/crawl_case_packets.py crawl \
            --case-urls plan/case_urls.json \
            --batch-index '${{ matrix.batch_index }}' \
            --start '${{ matrix.start }}' \
            --end '${{ matrix.end }}' \
            --output-dir "$OUT" \
            --page-delay-seconds 8.0 \
            --asset-delay-seconds 2.0 \
            --max-attachment-bytes 150000000 \
            --max-batch-attachment-bytes 1000000000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geipan-case-packet-batch-${{ matrix.batch_index }}
          path: batch-${{ matrix.batch_index }}/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90

  aggregate:
    needs: [plan, acquire]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: geipan-case-packet-batch-*
          path: batch-results
          merge-multiple: false
      - name: Aggregate and validate case-packet source snapshot
        run: |
          mkdir -p aggregate
          python ufo_atlas/ingestion/geipan/crawl_case_packets.py aggregate \
            --input-dir batch-results \
            --output-dir aggregate \
            --expected-cases "$EXPECTED_CASES"
          (cd aggregate && zip -q -r ../GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip .)
          sha256sum GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip > GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip.sha256
          unzip -t GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0
          path: |
            GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip
            GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Preserve compact completion evidence
        run: |
          set -euo pipefail
          mkdir -p ufo_atlas/ingestion/geipan/case_packets_latest
          cp aggregate/SUMMARY.json ufo_atlas/ingestion/geipan/case_packets_latest/
          cp aggregate/CASE_PAGE_INDEX.csv ufo_atlas/ingestion/geipan/case_packets_latest/
          cp GEIPAN_CASE_PACKET_AND_ATTACHMENT_SNAPSHOT_v0.1.0.zip.sha256 ufo_atlas/ingestion/geipan/case_packets_latest/PACKAGE_SHA256.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > ufo_atlas/ingestion/geipan/case_packets_latest/WORKFLOW_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ufo_atlas/ingestion/geipan/case_packets_latest
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Preserve GEIPAN case-packet acquisition evidence [skip ci]'
          git push
